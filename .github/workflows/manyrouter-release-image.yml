name: Publish ManyRouter New API image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable ManyRouter combination version
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - name: Validate release identity
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,116}$'; then
            echo "::error::Version cannot be used as an immutable container tag"
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set application build version
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.short_sha }}
        run: printf '%s\n' "$BUILD_VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: GO_PROXY=https://proxy.golang.org,direct
          tags: |
            ghcr.io/evepupil/new-api:manyrouter-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            ghcr.io/evepupil/new-api:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/evepupil/new-api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=manyrouter-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=manyrouter-${{ matrix.arch }}

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/evepupil/new-api:manyrouter-${RELEASE_VERSION}" \
            -t "ghcr.io/evepupil/new-api:sha-${GITHUB_SHA}" \
            "ghcr.io/evepupil/new-api:manyrouter-${RELEASE_VERSION}-amd64" \
            "ghcr.io/evepupil/new-api:manyrouter-${RELEASE_VERSION}-arm64"

      - name: Record manifest digest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "ghcr.io/evepupil/new-api:manyrouter-${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
